services:
  postgres-source:
    image: postgres:17
    container_name: postgres-source
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payment_db

    ports:
      - "127.0.0.1:5433:5432"

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5

    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  metabase:
    image: metabase/metabase:v0.64.1
    container_name: zibal-metabase
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: UTC

    volumes:
      - metabase_data:/metabase-data

    depends_on:
      postgres-source:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: zibal-clickhouse
    restart: unless-stopped

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: zibal
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"

    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test:
        - CMD-SHELL
        - "clickhouse-client --user zibal --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_source_data:
  metabase_data:
  clickhouse_data:
